<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Materials</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4">
        <!-- Header -->
        <header class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold">Engineering Materials</h1>
            <div>
                <button id="addMaterialBtn" class="bg-blue-600 text-white py-2 px-4 rounded">Add Material</button>
                <button id="printBtn" class="bg-green-600 text-white py-2 px-4 rounded ml-2">Print</button>
                <button id="exportBtn" class="bg-yellow-600 text-white py-2 px-4 rounded ml-2">Export to CSV</button>
            </div>
        </header>

        <!-- Search -->
        <div class="mb-4">
            <input id="searchInput" type="text" class="w-full p-2 border border-gray-300 rounded" placeholder="Search materials...">
        </div>

        <!-- Materials Table -->
        <table id="materialsTable" class="min-w-full bg-white border border-gray-300 rounded-lg">
            <thead>
                <tr class="bg-gray-200">
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">Item #</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">Material Name</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">Specifications</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">In Stock</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">Out Stock</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">Remaining</th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 no-print">Actions</th>
                </tr>
            </thead>
            <tbody id="materialsTableBody">
                <!-- Table rows will be dynamically inserted here -->
            </tbody>
        </table>

        <!-- Summary -->
        <div class="mt-4">
            <p id="totalItems">Total Materials: 0</p>
            <p id="lastUpdated">Last updated: Never</p>
        </div>
    </div>

    <!-- Add/Edit Material Modal -->
    <div id="materialModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h2 id="modalTitle" class="text-xl font-semibold mb-4">Add New Material</h2>
            <form id="materialForm">
                <div class="mb-4">
                    <label for="itemNumber" class="block text-sm font-medium text-gray-700">Item Number</label>
                    <input type="text" id="itemNumber" class="w-full p-2 border border-gray-300 rounded" disabled>
                </div>
                <div class="mb-4">
                    <label for="materialName" class="block text-sm font-medium text-gray-700">Material Name</label>
                    <input type="text" id="materialName" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="specifications" class="block text-sm font-medium text-gray-700">Specifications</label>
                    <input type="text" id="specifications" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="inStock" class="block text-sm font-medium text-gray-700">In Stock</label>
                    <input type="number" id="inStock" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="outStock" class="block text-sm font-medium text-gray-700">Out Stock</label>
                    <input type="number" id="outStock" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <input type="hidden" id="editItemId">
                <div class="flex justify-between">
                    <button type="button" id="cancelBtn" class="bg-gray-500 text-white py-2 px-4 rounded">Cancel</button>
                    <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h2 class="text-xl font-semibold mb-4">Are you sure you want to delete this material?</h2>
            <div class="flex justify-between">
                <button type="button" id="cancelDeleteBtn" class="bg-gray-500 text-white py-2 px-4 rounded">Cancel</button>
                <button type="button" id="confirmDeleteBtn" class="bg-red-600 text-white py-2 px-4 rounded">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
